# =========================================
# UCT8086-AI: Open Agent Harness Configuration
# =========================================

server:
  port: 9081

# Actuator + Prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: uct8086-ai

  # Disable PgVectorStore auto-config — we create our own in PgVectorConfig
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  # Datasource (MySQL — 外部实例)
  datasource:
#    url: jdbc:mysql://10.94.77.17:3506/uct8086_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    url: jdbc:mysql://127.0.0.1:3306/uct8086_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root.2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # SQL initialization disabled — schema is applied manually via docker/init.sql
  sql:
    init:
      mode: never

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:0.0.0.0}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 0
          max-wait: -1ms

  # Spring AI Configuration
  ai:
    # Chat: DeepSeek (OpenAI compatible protocol)
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7
      # DeepSeek has no embedding API — must be disabled
      embedding:
        enabled: false

    # Embedding: local Ollama
    ollama:
      embedding:
        enabled: true
        options:
          model: bge-m3
      chat:
        enabled: false

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# pgvector (PostgreSQL with vector extension)
pgvector:
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:5432/${PGVECTOR_DB:postgres}
    username: ${PGVECTOR_USER:postgres}
    password: ${PGVECTOR_PASSWORD:321432}
    driver-class-name: org.postgresql.Driver

# UCT8086-AI Harness Configuration
uct8086:
  ai:
    # Permission mode: DEFAULT, AUTO, PLAN_MODE, READ_ONLY
    permission-mode: DEFAULT

    # Maximum agent loop iterations
    max-turns: 50

    # API retry configuration
    retry-enabled: true
    max-retries: 3
    retry-delay-ms: 1000

    # Parallel tool execution
    parallel-tool-execution: true

    # Context compression (auto-compact)
    context-compression: true
    compression-threshold: 100000

    # Working directory for file operations
    working-directory: ${user.dir}

    # Memory file location (default: <working-directory>/.uct8086/MEMORY.md)
    # memory-file: ${user.dir}/.uct8086/MEMORY.md

    # ========== Cost / Budget Alerting ==========
    # Enable cost alerting (WARN/ERROR logs when budget thresholds exceeded)
    cost-alert-enabled: true

    # Warning threshold for per-session cost (CNY yuan). Logs WARN.
    session-cost-warn-threshold: 5.0

    # Hard limit for per-session cost (CNY yuan). Logs ERROR. 0 = disabled.
    session-cost-hard-limit: 0.0

    # Warning threshold for total accumulated cost across all sessions (CNY yuan).
    total-cost-warn-threshold: 100.0

    # Custom pricing per 1M tokens (USD). Overrides TokenUsage defaults.
    # Default: input=$0.435/M, output=$0.28/M (DeepSeek V4 Pro permanent pricing)
    # input-price-per-m: 0.435
    # output-price-per-m: 0.28

    # Model override (optional)
    # model: gpt-4o
    # temperature: 0.7

# Logging
logging:
  file:
    name: logs/uct8086-ai.log
  level:
    uct8086.ai: INFO
    org.springframework.ai: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
