# =========================================
# UCT8086-AI: Open Agent Harness Configuration
# =========================================

server:
  port: 9081

spring:
  application:
    name: uct8086-ai

  # Datasource (MySQL)
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:uct8086_ai}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root.2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # SQL initialization (runs schema.sql on startup)
  sql:
    init:
      mode: always

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:0.0.0.0}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 0
          max-wait: -1ms

  # Spring AI Configuration
  ai:
    openai:
      api-key: sk-09295f72e43c4e8ebeca60ec550d1589
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7

# UCT8086-AI Harness Configuration
uct8086:
  ai:
    # Permission mode: DEFAULT, AUTO, PLAN_MODE, READ_ONLY
    permission-mode: DEFAULT

    # Maximum agent loop iterations
    max-turns: 50

    # API retry configuration
    retry-enabled: true
    max-retries: 3
    retry-delay-ms: 1000

    # Parallel tool execution
    parallel-tool-execution: true

    # Context compression (auto-compact)
    context-compression: true
    compression-threshold: 100000

    # Working directory for file operations
    working-directory: ${user.dir}

    # Memory file location (default: <working-directory>/.uct8086/MEMORY.md)
    # memory-file: ${user.dir}/.uct8086/MEMORY.md

    # Model override (optional)
    # model: gpt-4o
    # temperature: 0.7

# Logging
logging:
  file:
    name: logs/uct8086-ai.log
  level:
    uct8086.ai: DEBUG
    org.springframework.ai: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
