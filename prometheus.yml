# =========================================
# Prometheus 配置 — 抓取 UCT8086-AI 的 /actuator/prometheus
# =========================================
# 说明：
#   - target 用 host.docker.internal:9081，因为 Prometheus 跑在 Docker 容器里，
#     访问宿主机上运行的 Spring Boot 应用（9081 端口）不能用 localhost。
#   - 如果后端也容器化了，可改成后端服务的容器名（如 http://backend:9081/actuator/prometheus）。
#   - Linux 宿主机需在 docker-compose 里给 prometheus 加 extra_hosts:
#       "host.docker.internal:host-gateway"

global:
  scrape_interval: 15s      # 每 15 秒抓取一次
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'uct8086-ai'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9081']
