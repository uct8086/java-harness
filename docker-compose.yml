version: '3.8'

# =========================================
# UCT8086-AI 本地开发环境 — Docker Compose
# =========================================
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v

services:

  # Redis 7.x — 会话缓存
  redis:
    image: redis:7-alpine
    container_name: uct8086-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL 17 + pgvector — 向量存储
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uct8086-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 321432
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus — 抓取 UCT8086-AI 的 /actuator/prometheus 指标
  prometheus:
    image: prom/prometheus:latest
    container_name: uct8086-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana — 可视化 Prometheus 采集的指标
  grafana:
    image: grafana/grafana:latest
    container_name: uct8086-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
