version: '3.8'

# =========================================
# UCT8086-AI 本地开发环境 — Docker Compose
# =========================================
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v

services:

  # Redis 7.x — 会话缓存
  redis:
    image: redis:7-alpine
    container_name: uct8086-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL 17 + pgvector — 向量存储
  postgres:
    image: pgvector/pgvector:pg17
    container_name: uct8086-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 321432
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  postgres-data:
